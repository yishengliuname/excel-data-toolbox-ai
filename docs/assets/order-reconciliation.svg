<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="title description">
  <title id="title">Order reconciliation demo</title>
  <desc id="description">Six order rows and five payout rows are matched by order ID. Two orders match exactly. DEMO-002 was due 158 and received 148, a shortfall of 10. Two orders are unmatched and three duplicate rows are isolated.</desc>
  <rect x="1" y="1" width="898" height="338" rx="20" fill="#f4f8f7" stroke="#cddfd9"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="32" y="37" fill="#0c6557" font-size="14" font-weight="700" letter-spacing="2">EXCEL DATA TOOLBOX AI</text>
    <text x="32" y="76" fill="#16312b" font-size="30" font-weight="750">Order reconciliation demo</text>
    <text x="32" y="103" fill="#4a665e" font-size="15">Fictional orders and payouts · Runs locally · No API key</text>
    <rect x="32" y="129" width="247" height="163" rx="12" fill="#fff" stroke="#d6e4df"/>
    <rect x="326" y="129" width="247" height="163" rx="12" fill="#fff" stroke="#d6e4df"/>
    <rect x="620" y="129" width="248" height="163" rx="12" fill="#133c36"/>
    <g fill="#0c6557" font-size="14" font-weight="750">
      <text x="50" y="160">01  INPUT</text>
      <text x="344" y="160">02  RECONCILE</text>
      <text x="638" y="160" fill="#a5e9d3">03  EXCEL OUTPUT</text>
    </g>
    <g fill="#16312b" font-size="18" font-weight="650">
      <text x="50" y="199">6 order rows</text>
      <text x="50" y="227">5 payout rows</text>
      <text x="344" y="199">2 exact matches</text>
      <text x="344" y="227">2 unmatched orders</text>
      <text x="638" y="199" fill="#fff">DEMO-002: −10</text>
    </g>
    <g font-size="14">
      <text x="50" y="265" fill="#4a665e">Matched on order ID</text>
      <text x="344" y="265" fill="#4a665e">3 duplicate rows isolated</text>
      <text x="638" y="227" fill="#e0f1ed">158 due · 148 paid</text>
      <text x="638" y="265" fill="#e0f1ed">Summary and review sheets</text>
    </g>
    <path d="M291 211h21m-7-7 7 7-7 7m280-7h21m-7-7 7 7-7 7" fill="none" stroke="#5a8b80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="320" fill="#4a665e" font-size="13">Walkthrough based on the workbook generated by the built-in demo.</text>
  </g>
</svg>
