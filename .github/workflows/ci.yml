name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[automation,dev]"
      - name: Block secrets and customer data
        run: python scripts/check_secrets.py
      - name: Critical static checks
        run: python -m ruff check . --select E9,F63,F7,F82
      - name: Test
        run: python -m pytest -q
      - name: Build source and wheel
        run: python -m build
