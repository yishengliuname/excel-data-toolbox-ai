name: Domain pack
description: 增加或修正可配置行业术语和标准概念
title: "[Domain] "
body:
  - type: input
    id: domain
    attributes:
      label: 行业/领域
      placeholder: 例如 教育培训
    validations:
      required: true
  - type: textarea
    id: anchors
    attributes:
      label: 行业身份词与通用业务词
      description: 解释哪些词能确认行业，哪些只是成本、库存等跨行业子域。
    validations:
      required: true
  - type: textarea
    id: concepts
    attributes:
      label: 标准概念映射
      description: 使用完全虚构的字段名示例，不要包含客户名称或真实数据。
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: 跨行业冲突与测试场景
      description: 说明如何避免被现有领域误识别，以及预期能力/证据缺口。
    validations:
      required: true
  - type: checkboxes
    id: generic
    attributes:
      label: 通用性确认
      options:
        - label: 该能力包不包含客户名称、客户阈值或客户专用公式。
          required: true
        - label: 我愿意为领域识别和证据缺口补充自动测试。
          required: true
