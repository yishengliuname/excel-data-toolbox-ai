name: Feature request
description: Propose a focused improvement grounded in a real spreadsheet task
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What real Excel task are you trying to solve?
      description: Explain the recurring job and why current workflows do not complete it. Do not describe a customer-specific template.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Input, output, and evidence boundary
      description: Use fictional columns to describe the input, expected deliverable, and what should happen when evidence is missing.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested approach
  - type: textarea
    id: acceptance
    attributes:
      label: Testable acceptance criteria
      placeholder: Include normal, missing-field, duplicate-key, and insufficient-evidence cases.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal does not require the model to execute arbitrary code, SQL, or file operations.
          required: true
        - label: The example contains no customer data or active credentials.
          required: true
