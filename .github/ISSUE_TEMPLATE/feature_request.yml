name: Feature request
description: 提议新的通用能力或体验改进
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的通用问题
      description: 说明多个用户都会遇到的问题，不要只描述一个客户的专用模板。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 输入、输出与证据边界
      description: 使用虚构字段说明输入范围、预期交付，以及数据不足时应如何处理。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
  - type: textarea
    id: acceptance
    attributes:
      label: 可自动验证的验收条件
      placeholder: 至少列出正常、缺失字段、重复键和证据不足场景。
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该功能不要求模型直接执行任意代码、SQL 或文件操作。
          required: true
        - label: 示例不包含客户数据或有效凭据。
          required: true
