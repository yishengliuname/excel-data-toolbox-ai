name: Bug report
description: Report a reproducible error, crash, or incorrect result
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not upload customer data, API keys, `.env`, databases, or private screenshots. Report security vulnerabilities privately according to SECURITY.md.
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: 9.9.0, Windows ZIP name, or commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Enter "packaged release" if you used the Windows ZIP.
      placeholder: 3.12.5 or packaged release
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Windows release ZIP
        - Editable source install
        - Source install from requirements
        - Other
    validations:
      required: true
  - type: dropdown
    id: input_type
    attributes:
      label: Input file type
      options:
        - XLSX
        - XLSM
        - CSV or TSV
        - PDF or image
        - SQLite, ODBC, or Parquet
        - Built-in synthetic demo
        - Other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Fictionalized request and schema
      description: Provide only synthetic sheet names, column names, and dimensions. Do not paste private cell values.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      placeholder: |
        1. Start the app...
        2. Load the synthetic demo or a code-generated minimal file...
        3. Run...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove customer values, user names, private paths, connection strings, and credentials. Paste only the relevant error lines.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm that this report contains no customer data, personal information, or active credentials.
          required: true
        - label: I searched existing issues and reproduced this on the latest release or main branch.
          required: true
